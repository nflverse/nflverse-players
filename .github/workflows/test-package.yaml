# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: test-package

permissions: read-all

jobs:
  test-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # read-only token for the private dependencies (nflapi,
      # nflverse-espn). Fork PRs get no secrets, so it's skipped there.
      - id: read-token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflapi, nflverse-espn

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ steps.read-token.outputs.token }}
        with:
          extra-packages: any::devtools

      - name: Test Package
        run: "devtools::test()"
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
