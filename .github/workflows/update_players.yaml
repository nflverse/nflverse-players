on:
  schedule:
    # Every day at 8:07 UTC/4:07 ET
    - cron:  '7 8 * * *'
  workflow_dispatch:
    inputs:
      season_rebuild:
        description: 'Rebuild Season (9999 defaults to latest season). Do multiple seasons comma separated, e.g. 2017,2019,2021'
        required: false
        default: 9999
        type: number
      full_rebuild:
        description: 'Full Rebuild (overwrites above season)'
        required: true
        default: false
        type: boolean

name: Update Players Data

# Each job installs the private packages with a read-only app token and gets
# an upload token only on its release step, minted after setup (which
# installs unpinned GitHub code). See https://github.com/nflverse/actions
permissions:
  contents: read

jobs:
  update_setup:
    runs-on: ubuntu-latest
    name: update_setup
    outputs:
      seasons: ${{ steps.seasons.outputs.seasons }}
    steps:
      - id: seasons
        uses: nflverse/actions/season-matrix@v1
        with:
          first-season: 1999
          roster: true
          season-rebuild: ${{ inputs.season_rebuild }}
          full-rebuild: ${{ inputs.full_rebuild }}

  update_season_data:
    needs: update_setup
    name: Update ${{ matrix.season }} ${{ matrix.type }} data
    runs-on: ubuntu-latest
    container: ghcr.io/nflverse/r-runner:latest
    strategy:
      fail-fast: false
      matrix:
        season: ${{ fromJson(needs.update_setup.outputs.seasons) }}
        type: ["roster", "raw_draft", "raw_pff", "raw_espn", "raw_ngs"]
    env:
      NFLVERSE_UPDATE_SEASON: ${{ matrix.season }}
      NFLVERSE_UPDATE_TYPE: ${{ matrix.type }}
      NFLVERSE.UPLOAD.QUIET: false
    steps:
      - id: read-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflapi, nflverse-espn

      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflapi nflverse/nflverse-espn nflverse/nflverse-data nflverse/nflreadr nflverse/undercover
          install-local: true
          github-pat: ${{ steps.read-token.outputs.token }}

      # write access to this repo's releases only
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          contents: write

      - name: Release ${{ matrix.season }} ${{ matrix.type }}
        run: Rscript -e 'source("build/00_update_season_data.R")'
        env:
          # used by the gh cli for release uploads
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}

  update_components:
    needs: [update_setup, update_season_data]
    name: Update ${{ matrix.type }} data
    runs-on: ubuntu-latest
    container: ghcr.io/nflverse/r-runner:latest
    strategy:
      fail-fast: false
      matrix:
        type: ["basis", "pfr", "otc", "pff", "draft", "espn", "ngs"]
    env:
      NFLVERSE_UPDATE_TYPE: ${{ matrix.type }}
      PLAYERS_ESPN_REBUILD: ${{ inputs.full_rebuild || false }}
      PLAYERS_PFR_REBUILD: ${{ inputs.full_rebuild || false }}
      NFLVERSE.UPLOAD.QUIET: false
    steps:
      - id: read-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflapi, nflverse-espn

      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflapi nflverse/nflverse-espn nflverse/nflverse-data nflverse/nflreadr nflverse/undercover
          install-local: true
          github-pat: ${{ steps.read-token.outputs.token }}

      # write access to this repo's releases only
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          contents: write

      - name: Release ${{ matrix.type }}
        run: Rscript -e 'source("build/01_update_components.R")'
        env:
          # used by the gh cli for release uploads
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}
          PLAYERS_PFR_BASE: ${{ secrets.PLAYERS_PFR_BASE }}
          PLAYERS_OTC_PLAYERID_ENDPOINT: ${{ secrets.PLAYERS_OTC_PLAYERID_ENDPOINT }}
          PLAYERS_OTC_API_KEY: ${{ secrets.PLAYERS_OTC_API_KEY }}
          SCRAPEOPS_API_KEY: ${{ secrets.PLAYERS_SCRAPEOPS_API_KEY }}

  build_dataset:
    needs: [update_components]
    name: Build Full Dataset
    runs-on: ubuntu-latest
    container: ghcr.io/nflverse/r-runner:latest
    env:
      NFLVERSE.UPLOAD.QUIET: false
    steps:
      - id: read-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflapi, nflverse-espn

      - uses: nflverse/actions/setup@v1
        with:
          packages: nflverse/nflapi nflverse/nflverse-espn nflverse/nflverse-data nflverse/nflreadr nflverse/undercover
          install-local: true
          github-pat: ${{ steps.read-token.outputs.token }}

      # players_components (this repo) and players (nflverse-data)
      - id: upload-token
        uses: nflverse/actions/app-token@v1
        with:
          client-id: ${{ vars.NFLVERSE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NFLVERSE_APP_PRIVATE_KEY }}
          repositories: nflverse-players, nflverse-data
          contents: write

      - name: Release Players Data
        run: Rscript -e 'nflverse.players::players_build_dataset(release = TRUE)'
        env:
          # used by the gh cli for release uploads
          GH_TOKEN: ${{ steps.upload-token.outputs.token }}
